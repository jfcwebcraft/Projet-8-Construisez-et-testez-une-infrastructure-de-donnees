name: 'forecast_weather'
version: '1.0.0'
config-version: 2

# Ce projet transforme les données météo brutes (RAW Airbyte) en un schéma analytique
# en étoile, prêt à l'emploi pour les Data Scientists de GreenCoop (projet Forecast 2.0).
profile: 'forecast_weather'

# Répertoires
model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# -----------------------------------------------------------------
# Configuration des couches de transformation
# Stratégie :
#   staging      -> vues (légères, accès direct aux tables RAW)
#   intermediate -> vues (unification multi-sources)
#   marts        -> tables matérialisées (consommation analytique)
# -----------------------------------------------------------------
models:
  forecast_weather:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
      # Index sur les colonnes de jointure et de filtre fréquents
      dim_weather_stations:
        +indexes:
          - columns: ["station_id"]
            unique: true
          - columns: ["source"]
      dim_dates:
        +indexes:
          - columns: ["date_jour"]
            unique: true
          - columns: ["annee", "mois"]
      fact_weather_observations:
        +indexes:
          - columns: ["observation_id"]
            unique: true
          - columns: ["station_id"]
          - columns: ["date_heure_utc"]
          - columns: ["date_jour"]

seeds:
  forecast_weather:
    dim_stations_seed:
      +schema: seeds
